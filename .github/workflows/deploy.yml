name: Deploy to K3s Cluster

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 33342 -H ${{ secrets.ORACLE1_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh -p 33342 -o BatchMode=yes ubuntu@${{ secrets.ORACLE1_HOST }} "echo 'SSH OK'"

      - name: Build and deploy
        run: |
          # Build on oracle-1 directly (ARM64 native) instead of locally (x86)
          rsync -avz -e "ssh -p 33342" --exclude '.git*' --exclude '.github' ./ ubuntu@${{ secrets.ORACLE1_HOST }}:/tmp/antonsatt-build/

          # Build image and import into K3s on oracle-1
          ssh -p 33342 ubuntu@${{ secrets.ORACLE1_HOST }} "
            cd /tmp/antonsatt-build &&
            echo 'FROM nginx:alpine' > Dockerfile &&
            echo 'COPY . /usr/share/nginx/html/' >> Dockerfile &&
            sudo docker build -t antonsatt-site:latest . &&
            sudo docker save antonsatt-site:latest | sudo k3s ctr images import - &&
            rm -rf /tmp/antonsatt-build
          "

          # Restart deployment
          ssh -p 33342 ubuntu@${{ secrets.ORACLE1_HOST }} "sudo k3s kubectl -n apps rollout restart deployment antonsatt"
