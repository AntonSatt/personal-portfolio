name: Build and publish website

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: personal-portfolio-production
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/antonsatt/personal-portfolio
  MANIFEST_PATH: deploy/k8s/website.yaml

jobs:
  build-publish-and-update:
    name: Build, verify, publish, and update desired state
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build ARM64 image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:main" \
            .

      - name: Smoke-test image
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1:8080:80 "${IMAGE_NAME}:${GITHUB_SHA}")"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/portfolio-index.html; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done

          grep --fixed-strings --quiet "Anton" /tmp/portfolio-index.html

      - name: Log in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish immutable and branch tags
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"

      - name: Record the immutable image in desired state
        run: |
          set -euo pipefail
          match_count="$(grep --extended-regexp --count "image: ${IMAGE_NAME}:" "${MANIFEST_PATH}")"
          if [ "${match_count}" -ne 1 ]; then
            echo "Expected exactly one website image in ${MANIFEST_PATH}, found ${match_count}."
            exit 1
          fi

          sed --in-place --regexp-extended \
            "s#(image: ${IMAGE_NAME}:).*#\1${GITHUB_SHA}#" \
            "${MANIFEST_PATH}"
          grep --fixed-strings --quiet \
            "image: ${IMAGE_NAME}:${GITHUB_SHA}" \
            "${MANIFEST_PATH}"
          git diff --check

          if git diff --quiet -- "${MANIFEST_PATH}"; then
            echo "Desired state already references ${GITHUB_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          git commit --message "chore(deploy): use image ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main

      - name: Write deployment summary
        run: |
          {
            echo "## Website image published"
            echo
            echo "- Image: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Deployment: ArgoCD reads \`${MANIFEST_PATH}\`"
            echo "- Oracle SSH used: no"
          } >>"${GITHUB_STEP_SUMMARY}"
