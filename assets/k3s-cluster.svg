<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold">K3s Cluster Architecture</text>

  <!-- DNS -->
  <rect x="300" y="60" width="200" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">DigitalOcean DNS</text>

  <!-- Arrow DNS to Traefik -->
  <line x1="400" y1="100" x2="400" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cluster Box -->
  <rect x="50" y="135" width="700" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="158" fill="#64748b" font-family="monospace" font-size="11">K3s Cluster (Oracle Cloud Free Tier)</text>

  <!-- Traefik -->
  <rect x="300" y="170" width="200" height="36" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
  <text x="400" y="193" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="12">Traefik (Ingress)</text>

  <!-- cert-manager -->
  <rect x="550" y="170" width="160" height="36" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
  <text x="630" y="193" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">cert-manager + LE</text>

  <!-- Arrow Traefik to Apps -->
  <line x1="340" y1="206" x2="200" y2="240" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="206" x2="400" y2="240" stroke="#475569" stroke-width="1.5"/>
  <line x1="460" y1="206" x2="600" y2="240" stroke="#475569" stroke-width="1.5"/>

  <!-- App Pods Row 1 -->
  <rect x="80" y="240" width="150" height="55" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="155" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">antonsatt.com</text>
  <text x="155" y="280" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">nginx:alpine</text>

  <rect x="250" y="240" width="150" height="55" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="325" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">CarbonShift</text>
  <text x="325" y="280" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">Next.js + FastAPI</text>

  <rect x="420" y="240" width="150" height="55" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="495" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">SSH Radar</text>
  <text x="495" y="280" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">React + Grafana + PG</text>

  <rect x="590" y="240" width="140" height="55" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="660" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">Sattbot</text>
  <text x="660" y="280" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">discord.py</text>

  <!-- ArgoCD -->
  <rect x="80" y="320" width="200" height="50" rx="6" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
  <text x="180" y="342" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12">ArgoCD (GitOps)</text>
  <text x="180" y="358" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">auto-sync from GitHub</text>

  <!-- Nodes -->
  <rect x="350" y="320" width="170" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="435" y="340" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">oracle-1 (server)</text>
  <text x="435" y="356" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">2 CPU / 12GB RAM</text>

  <rect x="540" y="320" width="170" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="625" y="340" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">oracle-2 (agent)</text>
  <text x="625" y="356" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">2 CPU / 12GB RAM</text>

  <!-- VXLAN line between nodes -->
  <line x1="520" y1="345" x2="540" y2="345" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- GitLab -->
  <rect x="350" y="390" width="170" height="40" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
  <text x="435" y="415" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="11">GitLab CE (Docker)</text>

  <!-- GitHub -->
  <rect x="80" y="390" width="200" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="180" y="415" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">GitHub (IaC repo)</text>

  <!-- Arrow GitHub to ArgoCD -->
  <line x1="180" y1="390" x2="180" y2="370" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Cost badge -->
  <rect x="570" y="400" width="140" height="36" rx="18" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="640" y="423" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold">$0/month</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
