<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" fill="none">
  <rect width="800" height="580" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold">Infrastructure Architecture</text>

  <!-- DNS -->
  <rect x="300" y="60" width="200" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">DigitalOcean DNS</text>

  <!-- Arrow DNS to Traefik -->
  <line x1="400" y1="100" x2="400" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cluster Box -->
  <rect x="50" y="135" width="500" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="158" fill="#64748b" font-family="monospace" font-size="11">K3s Cluster (Oracle Cloud Free Tier)</text>

  <!-- Traefik -->
  <rect x="150" y="170" width="200" height="36" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
  <text x="250" y="193" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="12">Traefik (Ingress)</text>

  <!-- cert-manager -->
  <rect x="370" y="170" width="160" height="36" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="193" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">cert-manager + LE</text>

  <!-- Arrow Traefik to Apps -->
  <line x1="200" y1="206" x2="140" y2="240" stroke="#475569" stroke-width="1.5"/>
  <line x1="250" y1="206" x2="280" y2="240" stroke="#475569" stroke-width="1.5"/>
  <line x1="310" y1="206" x2="420" y2="240" stroke="#475569" stroke-width="1.5"/>

  <!-- App Pods Row 1 -->
  <rect x="70" y="240" width="130" height="50" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="135" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">antonsatt.com</text>
  <text x="135" y="278" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">nginx</text>

  <rect x="215" y="240" width="130" height="50" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="280" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">CarbonShift</text>
  <text x="280" y="278" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">Next.js + FastAPI</text>

  <rect x="360" y="240" width="130" height="50" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="425" y="260" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">SSH Radar</text>
  <text x="425" y="278" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">React + Grafana + PG</text>

  <!-- Row 2 -->
  <rect x="70" y="300" width="130" height="50" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="135" y="320" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">Sattbot</text>
  <text x="135" y="338" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">discord.py</text>

  <rect x="215" y="300" width="130" height="50" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
  <text x="280" y="320" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="10">GitLab CE</text>
  <text x="280" y="338" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="8">Docker (proxied)</text>

  <!-- ArgoCD -->
  <rect x="70" y="370" width="200" height="45" rx="6" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
  <text x="170" y="390" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11">ArgoCD (GitOps)</text>
  <text x="170" y="404" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="8">auto-sync from GitHub</text>

  <!-- Nodes -->
  <rect x="290" y="370" width="120" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="350" y="389" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">oracle-1</text>
  <text x="350" y="404" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">2CPU / 12GB</text>

  <rect x="420" y="370" width="120" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="480" y="389" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">oracle-2</text>
  <text x="480" y="404" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">2CPU / 12GB</text>

  <!-- VXLAN line -->
  <line x1="410" y1="392" x2="420" y2="392" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3"/>

  <!-- GitHub -->
  <rect x="70" y="430" width="200" height="36" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="170" y="453" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">GitHub (IaC repo)</text>
  <line x1="170" y1="430" x2="170" y2="415" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Raspberry Pi Box -->
  <rect x="590" y="135" width="180" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="158" fill="#64748b" font-family="monospace" font-size="11">Raspberry Pi 4 (Home)</text>

  <!-- Pi services -->
  <rect x="605" y="175" width="150" height="55" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
  <text x="680" y="197" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="10">are-we-up</text>
  <text x="680" y="215" text-anchor="middle" fill="#fb7185" font-family="monospace" font-size="8">Prometheus + Alertmgr</text>

  <rect x="605" y="245" width="150" height="55" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
  <text x="680" y="267" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">Grafana</text>
  <text x="680" y="285" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="8">Uptime + Metrics</text>

  <rect x="605" y="315" width="150" height="55" rx="6" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
  <text x="680" y="337" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="10">Nextcloud</text>
  <text x="680" y="355" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="8">Self-hosted storage</text>

  <!-- Monitoring arrow from Pi to Cluster -->
  <line x1="590" y1="200" x2="555" y2="200" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#redarrow)"/>
  <text x="572" y="215" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="8">monitors</text>

  <!-- Pi node info -->
  <rect x="605" y="390" width="150" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="680" y="409" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">rp4 (Tailscale)</text>
  <text x="680" y="424" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">4CPU / 4GB</text>

  <!-- Cost badge -->
  <rect x="330" y="510" width="140" height="40" rx="20" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="535" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold">$0/month</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
  </defs>
</svg>
