<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="675"/><line x1="60" y1="0" x2="60" y2="675"/>
    <line x1="120" y1="0" x2="120" y2="675"/><line x1="180" y1="0" x2="180" y2="675"/>
    <line x1="240" y1="0" x2="240" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/><line x1="420" y1="0" x2="420" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/><line x1="540" y1="0" x2="540" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/><line x1="660" y1="0" x2="660" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/><line x1="780" y1="0" x2="780" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/><line x1="1020" y1="0" x2="1020" y2="675"/>
    <line x1="1080" y1="0" x2="1080" y2="675"/><line x1="1140" y1="0" x2="1140" y2="675"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">Cloud Infrastructure Audit &amp; Migration Strategy</text>

  <!-- LEFT SIDE: Current AWS -->
  <text x="230" y="100" text-anchor="middle" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">CURRENT — AWS</text>
  <line x1="130" y1="112" x2="330" y2="112" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>

  <!-- AWS Container box -->
  <rect x="60" y="130" width="340" height="480" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- AWS Services -->
  <!-- RDS -->
  <rect x="90" y="155" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.4" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="120" y="177" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">RDS</text>
  <text x="120" y="196" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">PostgreSQL / MySQL databases</text>
  <text x="340" y="183" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">35%</text>

  <!-- ECS -->
  <rect x="90" y="220" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="120" y="242" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">ECS</text>
  <text x="120" y="261" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Container orchestration</text>
  <text x="340" y="248" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">16%</text>

  <!-- ElastiCache -->
  <rect x="90" y="285" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="120" y="307" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">ElastiCache</text>
  <text x="120" y="326" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Managed Redis clusters</text>
  <text x="340" y="313" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">10%</text>

  <!-- CloudFront -->
  <rect x="90" y="350" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="120" y="372" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">CloudFront</text>
  <text x="120" y="391" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">CDN &amp; content delivery</text>
  <text x="340" y="378" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">7%</text>

  <!-- S3 -->
  <rect x="90" y="415" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="120" y="437" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">S3 + ELB + VPC</text>
  <text x="120" y="456" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Storage, load balancing, networking</text>
  <text x="340" y="443" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">17%</text>

  <!-- CloudWatch + Other -->
  <rect x="90" y="480" width="280" height="52" rx="10" fill="#451a03" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1"/>
  <text x="120" y="502" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">CloudWatch + Other</text>
  <text x="120" y="521" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Monitoring, backups, support</text>
  <text x="340" y="508" text-anchor="end" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">15%</text>

  <!-- Cost label -->
  <rect x="120" y="550" width="220" height="40" rx="20" fill="#7c2d12" fill-opacity="0.4" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="230" y="575" text-anchor="middle" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Six-figure SEK / month</text>

  <!-- CENTER: Migration Arrow -->
  <!-- Arrow line -->
  <line x1="430" y1="370" x2="530" y2="370" stroke="url(#arrow-grad)" stroke-width="3" stroke-dasharray="8 4"/>
  <!-- Arrow head -->
  <polygon points="540,370 525,358 525,382" fill="#06b6d4"/>
  <!-- Arrow labels -->
  <text x="485" y="345" text-anchor="middle" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">MIGRATE</text>
  <text x="485" y="400" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">~50% savings</text>

  <!-- RIGHT SIDE: Proposed Setup -->
  <text x="830" y="100" text-anchor="middle" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">PROPOSED — Swedish Provider</text>
  <line x1="700" y1="112" x2="960" y2="112" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>

  <!-- Proposed Container box -->
  <rect x="660" y="130" width="480" height="480" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Swedish flag indicator -->
  <rect x="690" y="152" width="24" height="16" rx="2" fill="#005baa"/>
  <rect x="699" y="152" width="6" height="16" fill="#fecc00"/>
  <rect x="690" y="162" width="24" height="2" fill="#fecc00"/>
  <text x="722" y="165" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Data stays in Sweden</text>

  <!-- PostgreSQL -->
  <rect x="690" y="185" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="720" y="207" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">PostgreSQL</text>
  <text x="720" y="226" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Dedicated + replication</text>

  <!-- Kubernetes -->
  <rect x="690" y="250" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1"/>
  <text x="720" y="272" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Kubernetes</text>
  <text x="720" y="291" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">k3s / k8s orchestration</text>

  <!-- Redis -->
  <rect x="690" y="315" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1"/>
  <text x="720" y="337" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Redis</text>
  <text x="720" y="356" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Self-hosted (near zero cost)</text>

  <!-- Cloudflare -->
  <rect x="690" y="380" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.3" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="720" y="402" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Cloudflare</text>
  <text x="720" y="421" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">CDN (SaaS, keep external)</text>

  <!-- MinIO + Nginx -->
  <rect x="690" y="445" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.3" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="720" y="467" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">MinIO + Nginx</text>
  <text x="720" y="486" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">S3-compatible storage + LB</text>

  <!-- Grafana + Prometheus -->
  <rect x="690" y="510" width="200" height="52" rx="10" fill="#083344" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1"/>
  <text x="720" y="532" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Grafana + Prometheus</text>
  <text x="720" y="551" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Monitoring &amp; observability</text>

  <!-- Right side benefits -->
  <g transform="translate(920, 185)">
    <rect width="200" height="145" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="100" y="28" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Benefits</text>
    <line x1="20" y1="38" x2="180" y2="38" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="30" y="62" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="12">Up to 50% cost reduction</text>
    <text x="30" y="84" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="12">Full infrastructure control</text>
    <text x="30" y="106" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="12">Swedish data sovereignty</text>
    <text x="30" y="128" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="12">GDPR compliance</text>
  </g>

  <!-- Right side risks -->
  <g transform="translate(920, 350)">
    <rect width="200" height="122" rx="12" fill="#451a03" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
    <text x="100" y="28" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Considerations</text>
    <line x1="20" y1="38" x2="180" y2="38" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
    <text x="30" y="62" fill="#fcd34d" font-family="Inter, system-ui, sans-serif" font-size="12">Needs ops ownership</text>
    <text x="30" y="84" fill="#fcd34d" font-family="Inter, system-ui, sans-serif" font-size="12">Team training required</text>
    <text x="30" y="106" fill="#fcd34d" font-family="Inter, system-ui, sans-serif" font-size="12">Migration downtime risk</text>
  </g>

  <!-- Mapping arrows (connecting left services to right equivalents) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3">
    <line x1="400" y1="181" x2="690" y2="211"/>
    <line x1="400" y1="246" x2="690" y2="276"/>
    <line x1="400" y1="311" x2="690" y2="341"/>
    <line x1="400" y1="376" x2="690" y2="406"/>
    <line x1="400" y1="441" x2="690" y2="471"/>
    <line x1="400" y1="506" x2="690" y2="536"/>
  </g>

  <!-- Bottom label -->
  <text x="600" y="650" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">Service-by-service migration mapping — each AWS component has a proven open-source or managed equivalent</text>
</svg>
